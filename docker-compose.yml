services:
  db:
    image: mysql:8.0
    container_name: biblioteca-quintal-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: bibliotecaquintal
      MYSQL_ROOT_PASSWORD: biblioteca123
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbiblioteca123"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: biblioteca-quintal-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1
      - PYTHONUNBUFFERED=1
      - DB_NAME=bibliotecaquintal
      - DB_USER=biblioteca
      - DB_PASSWORD=biblioteca123
      - DB_HOST=db
      - DB_PORT=3306
      - EMAIL_BACKEND=${EMAIL_BACKEND:-}
      - EMAIL_HOST=${EMAIL_HOST:-mail.o5o.tech}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-bibliotecaquintaldasartes@o5o.tech}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-bibliotecaquintaldasartes@o5o.tech}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:11666}
    working_dir: /app/api
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    stdin_open: true
    tty: true

volumes:
  mysql_data:
