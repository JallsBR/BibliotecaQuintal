services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    # Só localhost no VPS — acesso externo via túnel SSH (DBeaver)
    ports:
      - "127.0.0.1:3309:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mail.o5o.tech}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-bibliotecaquintaldasartes@o5o.tech}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-bibliotecaquintaldasartes@o5o.tech}
      FRONTEND_URL: ${FRONTEND_URL:-https://bibliotecaquintaldasartes.o5o.tech}
    volumes:
      - media_data:/app/api/media
    ports:
      - "127.0.0.1:8082:8000"
    networks:
      - default
      - mail
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # Mesmo volume da API — Nginx do front serve /media/ (somente leitura).
      - media_data:/var/www/media:ro
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - default

volumes:
  mysql_data:
  media_data:

networks:
  default:
  mail:
    external: true
    name: mail-o5o_default
