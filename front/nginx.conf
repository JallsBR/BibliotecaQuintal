server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads Django (volume media_data). ^~ vence o regex de estáticos abaixo.
    location ^~ /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
