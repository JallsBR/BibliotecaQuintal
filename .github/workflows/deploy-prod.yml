name: Deploy produção

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-bibliotecaquintal-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          # 1) Preferir webhook (secret curto)
          if [ -n "${DEPLOY_TOKEN:-}" ]; then
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              'https://bibliotecaquintaldasartes.o5o.tech/__deploy__/deploy' \
              -H "X-Deploy-Token: $DEPLOY_TOKEN")
            echo "hook_http=$code"
            cat /tmp/out; echo
            [ "$code" = "202" ] && exit 0
            echo "hook falhou; tentando SSH..."
          fi
          # 2) Fallback SSH
          if [ -z "${SSH_KEY:-}" ]; then
            echo "Nem DEPLOY_HOOK_TOKEN nem VPS_SSH_KEY configurados"; exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY=~/.ssh/deploy_key
          # aceita chave PEM/OpenSSH multilinha, com \n literais, ou base64
          if echo "$SSH_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > "$KEY"
          elif echo "$SSH_KEY" | grep -q '\\n'; then
            printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' > "$KEY"
          else
            echo "$SSH_KEY" | tr -d '\n\r ' | base64 -d > "$KEY"
          fi
          chmod 600 "$KEY"
          ssh-keyscan -H 76.13.231.242 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes root@76.13.231.242 \
            '/opt/o5o/apps/bibliotecaquintal/deploy-sync.sh --force'
