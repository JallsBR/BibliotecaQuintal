name: Deploy produção

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-bibliotecaquintal-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_TOKEN:-}" ]; then
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              'https://bibliotecaquintaldasartes.o5o.tech/__deploy__/deploy' \
              -H "X-Deploy-Token: ${DEPLOY_TOKEN}")
            echo "hook_http=${code}"
            cat /tmp/out; echo
            if [ "${code}" = "202" ]; then exit 0; fi
            echo "hook falhou; tentando SSH..."
          fi

          if [ -z "${SSH_KEY:-}" ]; then
            echo "Configure o secret VPS_SSH_KEY (ou DEPLOY_HOOK_TOKEN)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY=~/.ssh/deploy_key

          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > "$KEY"
          if ! grep -q 'BEGIN' "$KEY"; then
            printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' > "$KEY"
          fi
          if ! grep -q 'BEGIN' "$KEY"; then
            echo "$SSH_KEY" | tr -d '\n\r\t ' | base64 -d > "$KEY"
          fi
          [ -n "$(tail -c1 "$KEY")" ] && echo >> "$KEY"
          chmod 600 "$KEY"

          echo "key_header=$(head -1 "$KEY")"
          ssh-keyscan -H 76.13.231.242 >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 root@76.13.231.242 \
            '/opt/o5o/apps/bibliotecaquintal/deploy-sync.sh --force'
